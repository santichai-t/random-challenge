<!DOCTYPE html>
<!--

  Project: Random Challenge Generator (Thai Edition)
  Build Version: 7A (V7A - Compact Conditions & Clean Production Build)
  Developed by: Santichai (Kiak) Teeravoramongkol

<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Challenge Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 860px;
            width: 92%;
            box-sizing: border-box;
        }
        h1 { 
            color: #333; 
            margin-top: 0;
            margin-bottom: 20px; 
            font-size: clamp(1.25rem, 3.5vw, 1.8rem);
            word-break: keep-all;
            line-height: 1.3;
        }
        .no-break {
            white-space: nowrap;
        }
        .box {
            font-size: clamp(0.75rem, 2.2vw, 1.28rem);
            color: #222;
            background: #eef2f3;
            padding: 28px 16px;
            border-radius: 8px;
            margin-bottom: 25px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.5;
            white-space: nowrap;
            overflow-x: hidden;
            box-sizing: border-box;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 14px 34px;
            font-size: 1.1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            touch-action: manipulation;
        }
        button:hover { background-color: #0056b3; }

        .highlight-item { 
            color: #1d4ed8; 
            font-weight: 600; 
        }
        .highlight-cond { 
            color: #047857; 
            font-weight: 600; 
        }

        .footer-credit {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #888;
            line-height: 1.6;
        }
        .footer-credit a {
            color: #666;
            text-decoration: underline;
        }
        .footer-credit a:hover {
            color: #007bff;
        }

        @media (max-width: 600px) {
            .container {
                padding: 24px 12px;
                width: 96%;
            }
            .box {
                padding: 20px 8px;
                font-size: clamp(0.7rem, 2.8vw, 0.95rem);
            }
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎯 เครื่องมือสุ่มโจทย์ / <span class="no-break">ไอเดีย</span></h1>
    <div class="box" id="promptDisplay">กดปุ่มด้านล่างเพื่อเริ่มสุ่มโจทย์</div>
    <button onclick="generatePrompt()">สุ่มโจทย์ (Randomize)</button>

    <div class="footer-credit">
        © 2026 พัฒนาโดย คุณสันติชัย ตีระวรมงคล (เกี๊ยก)<br>
        ได้รับแรงบันดาลใจจากเว็บไซต์ <a href="https://protobot.org" target="_blank" rel="noopener noreferrer">Protobot.org</a> (Inspired by Protobot.org)<br>
        และแนวคิดการเรียนรู้เชิงสร้างสรรค์ของ อาจารย์ธงชัย โรจน์กังสดาล & อาจารย์ณัฐชยา นรารัตน์
    </div>
</div>

<script src="database.js"></script>

<script>
    function getRandomItem(array) {
      return array[Math.floor(Math.random() * array.length)];
    }

    function generatePrompt() {
      const selectedObject = getRandomItem(objects);
      const selectedCondition = getRandomItem(conditions);

      const promptHTML = `ออกแบบ&nbsp; <span class="highlight-item">${selectedObject}</span> &nbsp;${selectedCondition.connector}&nbsp; <span class="highlight-cond">${selectedCondition.text}</span>`;
      
      document.getElementById("promptDisplay").innerHTML = promptHTML;
    }
</script>

</body>
</html>
